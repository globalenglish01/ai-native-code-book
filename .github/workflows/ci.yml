name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check packages/ examples/

      - name: Run full test suite (packages + product examples)
        run: uv run --python ${{ matrix.python-version }} pytest packages/ examples/tests -v --cov --cov-report=term-missing

      - name: Run quickstart examples (batch 1)
        run: uv run --python ${{ matrix.python-version }} python examples/quickstart.py

      - name: Run quickstart examples (batch 2)
        run: uv run --python ${{ matrix.python-version }} python examples/quickstart_v2.py

      - name: Run product examples end-to-end
        run: |
          uv run --python ${{ matrix.python-version }} python examples/products/customer_support_bot.py
          uv run --python ${{ matrix.python-version }} python examples/products/rag_qa_assistant.py
          uv run --python ${{ matrix.python-version }} python examples/products/code_review_assistant.py
          uv run --python ${{ matrix.python-version }} python examples/products/browser_task_agent.py
          uv run --python ${{ matrix.python-version }} python examples/products/research_team.py
          uv run --python ${{ matrix.python-version }} python examples/products/content_moderation_pipeline.py
          uv run --python ${{ matrix.python-version }} python examples/products/personal_assistant_with_memory.py
          uv run --python ${{ matrix.python-version }} python examples/products/agent_plugin_marketplace.py
          uv run --python ${{ matrix.python-version }} python examples/products/document_publishing_pipeline.py
          uv run --python ${{ matrix.python-version }} python examples/products/eval_harness.py
          uv run --python ${{ matrix.python-version }} python examples/products/devops_shell_agent.py
          uv run --python ${{ matrix.python-version }} python examples/products/structured_extraction_agent.py
          uv run --python ${{ matrix.python-version }} python examples/products/flagship_support_platform.py
          uv run --python ${{ matrix.python-version }} python examples/products/multi_tenant_saas_platform.py
          uv run --python ${{ matrix.python-version }} python examples/products/idempotent_payment_service.py
          uv run --python ${{ matrix.python-version }} python examples/products/compliance_governance_suite.py
          uv run --python ${{ matrix.python-version }} python examples/products/backpressure_job_processor.py

  security-audit:
    # Separate from the test matrix — dependency vulnerability scanning
    # doesn't need to repeat per OS/Python combo, and it checks known CVEs
    # in resolved dependencies rather than code quality (checklist J-category
    # gap: dependabot alone only proposes version bumps, it doesn't scan for
    # known-vulnerable versions already in use).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync workspace dependencies
        run: uv sync

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --local
