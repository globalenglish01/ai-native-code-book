[project]
name = "ainative-mcp"
version = "0.1.0"
description = "AI Native Framework MCP模块——MCP server配置组装、环境变量白名单、工具调用审计schema"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_mcp"]
