[project]
name = "ainative-rag"
version = "0.1.0"
description = "AI Native Framework RAG模块——文档分块、混合检索融合(RRF)、重排序聚合、检索增强生成流水线、Embedding批处理"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_rag"]
