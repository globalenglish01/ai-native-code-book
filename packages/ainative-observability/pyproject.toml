[project]
name = "ainative-observability"
version = "0.1.0"
description = "AI Native Framework 可观测性模块——结构化JSON日志、统一敏感信息过滤器、轻量级追踪span记录"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_observability"]
