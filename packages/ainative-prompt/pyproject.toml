[project]
name = "ainative-prompt"
version = "0.1.0"
description = "AI Native Framework Prompt模块——版本管理、A/B粘性路由、LLM-as-judge评判"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_prompt"]
