[project]
name = "ainative-security"
version = "0.1.0"
description = "AI Native Framework 安全模块——PII脱敏、输出安全检测、同形字折叠、密钥漂移巡检"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_security"]
