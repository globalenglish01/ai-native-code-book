[project]
name = "ainative-eval"
version = "0.1.0"
description = "AI Native Framework 评估治理模块——FCARS风格Gate、独立多评判聚合"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_eval"]
