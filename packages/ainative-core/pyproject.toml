[project]
name = "ainative-core"
version = "0.1.0"
description = "AI Native Framework 核心地基——Provider抽象、协议定义、内存版默认实现"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_core"]
