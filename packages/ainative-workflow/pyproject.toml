[project]
name = "ainative-workflow"
version = "0.1.0"
description = "AI Native Framework 工作流编排模块——轻量DAG编排引擎、HITL中断检测与超时安全默认值"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_workflow"]
