[project]
name = "ainative-guardrail"
version = "0.1.0"
description = "AI Native Framework 护栏模块——模型路由、预算/连续调用护栏、健康监控中间件"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
    "langgraph>=1.0",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_guardrail"]
