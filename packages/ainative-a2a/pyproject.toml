[project]
name = "ainative-a2a"
version = "0.1.0"
description = "AI Native Framework Agent间通信模块——任务委派、结果回传、agent能力注册与发现"
requires-python = ">=3.11"
dependencies = [
    "ainative-core",
]

[tool.uv.sources]
ainative-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_a2a"]
