[project]
name = "ainative-cli"
version = "0.1.0"
description = "AI Native Framework CLI——一条命令生成项目骨架"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ainative = "ainative_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainative_cli"]
