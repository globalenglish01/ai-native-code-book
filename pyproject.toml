[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ainative-core",
    "ainative-guardrail",
    "ainative-prompt",
    "ainative-security",
    "ainative-eval",
    "ainative-memory",
    "ainative-mcp",
    "ainative-workflow",
    "ainative-a2a",
    "ainative-cli",
]

[tool.uv.sources]
ainative-core = { workspace = true }
ainative-guardrail = { workspace = true }
ainative-prompt = { workspace = true }
ainative-security = { workspace = true }
ainative-eval = { workspace = true }
ainative-memory = { workspace = true }
ainative-mcp = { workspace = true }
ainative-workflow = { workspace = true }
ainative-a2a = { workspace = true }
ainative-cli = { workspace = true }

[project]
name = "ai-native-code-book-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
